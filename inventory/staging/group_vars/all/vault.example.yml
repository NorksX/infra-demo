---
# Schema of the encrypted vault.yml next to this file, with FAKE values.
# The real vault.yml is generated with random secrets by:
#
#   scripts/generate-vault.sh staging
#
# and can be viewed/edited with:
#
#   ansible-vault view inventory/staging/group_vars/all/vault.yml
#   ansible-vault edit inventory/staging/group_vars/all/vault.yml
#
# from the project root (the password comes from .vault_pass, set as
# vault_password_file in ansible.cfg).
#
# Each environment has DIFFERENT secrets (its own vault.yml).

mysql_root_password_vault: "CHANGE_ME"
wp_db_password_vault: "CHANGE_ME"
galera_sst_password_vault: "CHANGE_ME"
redis_password_vault: "CHANGE_ME"
wp_admin_password_vault: "CHANGE_ME"
haproxy_stats_password_vault: "CHANGE_ME"
keepalived_auth_password_vault: "CHANGE_ME"   # VRRP uses max 8 characters

wp_salts_vault:
  AUTH_KEY: "CHANGE_ME"
  SECURE_AUTH_KEY: "CHANGE_ME"
  LOGGED_IN_KEY: "CHANGE_ME"
  NONCE_KEY: "CHANGE_ME"
  AUTH_SALT: "CHANGE_ME"
  SECURE_AUTH_SALT: "CHANGE_ME"
  LOGGED_IN_SALT: "CHANGE_ME"
  NONCE_SALT: "CHANGE_ME"
