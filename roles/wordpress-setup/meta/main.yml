---
galaxy_info:
  role_name: wordpress_setup
  author: infra
  description: WordPress + WooCommerce via wp-cli — vault-driven wp-config, PHP-FPM pool, Nginx vhost, health check, cron
  license: MIT
  min_ansible_version: "2.17"
  platforms:
    - name: Ubuntu
      versions: [noble]
# The role renders a PHP-FPM pool and an Nginx vhost and reloads both
# services, so the Galaxy roles that install them run first, wherever this
# role is used (webservers.yml and rolling_update.yml).
dependencies:
  - role: geerlingguy.php
    tags: [php]
  - role: geerlingguy.nginx
    tags: [nginx]
