---
# Files: every node, as root (code is root-owned). --skip-plugins keeps active
# plugins from running (and writing to the NFS uploads) during these calls.
- name: Read installed plugin versions
  ansible.builtin.command: >-
    wp plugin get {{ item.name }} --field=version --allow-root --skip-plugins --skip-themes
    --path={{ wordpress_setup_docroot }}
  loop: "{{ wordpress_setup_plugins }}"
  loop_control:
    label: "{{ item.name }}"
  register: wordpress_setup_plugin_versions
  changed_when: false
  failed_when: false

- name: Install or update plugin files
  ansible.builtin.command: >-
    wp plugin install {{ item.item.name }} --version={{ item.item.version }} --force
    --allow-root --skip-plugins --skip-themes --path={{ wordpress_setup_docroot }}
  loop: "{{ wordpress_setup_plugin_versions.results }}"
  loop_control:
    label: "{{ item.item.name }} {{ item.item.version }}"
  when: item.rc != 0 or item.stdout != item.item.version
  changed_when: true
  notify: Reload php-fpm

- name: Remove unused bundled plugins
  ansible.builtin.file:
    path: "{{ wordpress_setup_docroot }}/wp-content/plugins/{{ item }}"
    state: absent
  loop: "{{ wordpress_setup_remove_plugins }}"

# What `wp redis enable` does, but as root: wp-content is not writable by PHP.
- name: Install the Redis object cache drop-in
  ansible.builtin.copy:
    src: "{{ wordpress_setup_docroot }}/wp-content/plugins/redis-cache/includes/object-cache.php"
    dest: "{{ wordpress_setup_docroot }}/wp-content/object-cache.php"
    remote_src: true
    owner: root
    group: www-data
    mode: "0644"

# Activation touches the database (shared): once, on the primary node.
- name: Activate plugins on the primary node
  run_once: true
  delegate_to: "{{ wordpress_setup_primary_node }}"
  become: true
  become_user: www-data
  environment:
    WP_CLI_CACHE_DIR: /var/cache/wp-cli
  block:
    - name: Check which plugins are active
      ansible.builtin.command: wp plugin is-active {{ item.name }} --path={{ wordpress_setup_docroot }}
      loop: "{{ wordpress_setup_plugins }}"
      loop_control:
        label: "{{ item.name }}"
      register: wordpress_setup_plugin_active
      changed_when: false
      failed_when: wordpress_setup_plugin_active.rc not in [0, 1]

    - name: Activate plugins
      ansible.builtin.command: wp plugin activate {{ item.item.name }} --path={{ wordpress_setup_docroot }}
      loop: "{{ wordpress_setup_plugin_active.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.rc == 1
      changed_when: true
