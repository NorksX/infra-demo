---
- name: System user for the health check
  ansible.builtin.user:
    name: "{{ galera_cluster_check_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Install the health check script
  ansible.builtin.template:
    src: galera-clustercheck.sh.j2
    dest: /usr/local/bin/galera-clustercheck
    owner: root
    group: root
    mode: "0755"

- name: Install the socket-activated health check units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - galera-clustercheck.socket
    - galera-clustercheck@.service
  notify: Restart clustercheck socket

- name: Enable the health check socket
  ansible.builtin.systemd_service:
    name: galera-clustercheck.socket
    state: started
    enabled: true
    daemon_reload: true
