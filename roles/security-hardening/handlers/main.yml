---
- name: Restart ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted

- name: Apply sysctl
  ansible.builtin.command:
    cmd: sysctl --load /etc/sysctl.d/90-hardening.conf
  changed_when: true
