---
- name: Install hardening packages
  ansible.builtin.apt:
    name: "{{ security_hardening_packages }}"
    state: present
    lock_timeout: 300
  tags: [hardening]

- name: SSH hardening
  ansible.builtin.import_tasks: ssh.yml
  tags: [hardening, ssh]

- name: Firewall
  ansible.builtin.import_tasks: firewall.yml
  when: security_hardening_firewall_enabled
  tags: [hardening, firewall]

- name: Brute-force protection (fail2ban)
  ansible.builtin.import_tasks: fail2ban.yml
  when: security_hardening_fail2ban_enabled
  tags: [hardening, fail2ban]

- name: Kernel parameters
  ansible.builtin.template:
    src: sysctl-hardening.conf.j2
    dest: /etc/sysctl.d/90-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl
  tags: [hardening, sysctl]

- name: Enable automatic security updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  when: security_hardening_unattended_upgrades
  tags: [hardening, updates]
