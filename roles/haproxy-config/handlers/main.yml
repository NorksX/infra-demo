---
# HAProxy runs in master-worker mode: a reload starts new workers with the new
# config and lets the old ones finish their connections (no dropped requests).
- name: Reload haproxy
  ansible.builtin.systemd_service:
    name: haproxy
    state: reloaded

- name: Restart rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog
    state: restarted

- name: Reload keepalived
  ansible.builtin.systemd_service:
    name: keepalived
    state: reloaded
