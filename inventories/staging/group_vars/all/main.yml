---
# Non-secret variables that REFERENCE vault secrets, so variable names stay
# discoverable without decrypting the vault. The real values live in the
# encrypted vault.yml next to this file (see vault.example.yml for the schema).
#
# Convention: every secret is named vault_<thing> in vault.yml and surfaced here
# as <thing>: "{{ vault_<thing> }}".

# --- Database ----------------------------------------------------------------
mysql_root_password: "{{ vault_mysql_root_password }}"
wp_db_password: "{{ vault_wp_db_password }}"
galera_sst_password: "{{ vault_galera_sst_password }}"

# --- Redis -------------------------------------------------------------------
redis_password: "{{ vault_redis_password }}"

# --- WordPress ---------------------------------------------------------------
wp_admin_password: "{{ vault_wp_admin_password }}"
# WordPress security salts (8 keys) come straight from the vault.
wp_salts: "{{ vault_wp_salts }}"

# --- HAProxy -----------------------------------------------------------------
haproxy_stats_password: "{{ vault_haproxy_stats_password }}"

# --- keepalived --------------------------------------------------------------
keepalived_auth_password: "{{ vault_keepalived_auth_password }}"
