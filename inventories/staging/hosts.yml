---
# Staging inventory — smaller mirror of production on a separate network.
# Network: 192.168.57.0/24. Single load balancer (no keepalived VIP),
# 2 WordPress nodes, 1 Redis, full 3-node Galera (quorum needs 3), 1 NFS.
#
# Run staging with: ENV=staging vagrant up   and   ./deploy.sh staging
# Only one environment runs at a time on a 16 GB host.

all:
  vars:
    env_name: staging
    domain: staging.shop.local
    site_url: "https://staging.shop.local"
    store_currency: EUR
    # Single LB in staging — the VIP equals the LB's own IP, keepalived disabled.
    lb_vip: 192.168.57.11
    network_cidr: 192.168.57.0/24
    private_subnet: 192.168.57.0/24

  children:
    loadbalancers:
      hosts:
        haproxy1:
          ansible_host: 192.168.57.11
          vb_memory: 384
          vb_cpus: 1

    wordpress:
      hosts:
        wp1:
          ansible_host: 192.168.57.21
          vb_memory: 640
          vb_cpus: 1
        wp2:
          ansible_host: 192.168.57.22
          vb_memory: 640
          vb_cpus: 1

    redis:
      hosts:
        cache1:
          ansible_host: 192.168.57.31
          vb_memory: 384
          vb_cpus: 1

    galera:
      hosts:
        db1:
          ansible_host: 192.168.57.41
          vb_memory: 768
          vb_cpus: 1
        db2:
          ansible_host: 192.168.57.42
          vb_memory: 768
          vb_cpus: 1
        db3:
          ansible_host: 192.168.57.43
          vb_memory: 768
          vb_cpus: 1

    storage:
      hosts:
        nfs1:
          ansible_host: 192.168.57.51
          vb_memory: 384
          vb_cpus: 1
