---
# Production inventory — single source of truth for hosts, IPs and VM sizing.
# The Vagrantfile parses this file to create the VMs, and Ansible uses it to
# configure them. Network: 192.168.56.0/24 (VirtualBox host-only).
#
# Per-host vars used by the Vagrantfile: ansible_host (static IP), vb_memory, vb_cpus.
# The keepalived VIP (192.168.56.10) is virtual — no VM is created for it.

all:
  vars:
    env_name: production
    domain: shop.local
    site_url: "https://shop.local"
    # WooCommerce store currency (cosmetic — see group_vars/all for the option mapping).
    store_currency: EUR
    # Virtual IP owned by keepalived on the load balancers.
    lb_vip: 192.168.56.10
    network_cidr: 192.168.56.0/24
    private_subnet: 192.168.56.0/24

  children:
    loadbalancers:
      hosts:
        haproxy1:
          ansible_host: 192.168.56.11
          vb_memory: 384
          vb_cpus: 1
        haproxy2:
          ansible_host: 192.168.56.12
          vb_memory: 384
          vb_cpus: 1

    wordpress:
      hosts:
        wp1:
          ansible_host: 192.168.56.21
          vb_memory: 640
          vb_cpus: 1
        wp2:
          ansible_host: 192.168.56.22
          vb_memory: 640
          vb_cpus: 1
        wp3:
          ansible_host: 192.168.56.23
          vb_memory: 640
          vb_cpus: 1
        wp4:
          ansible_host: 192.168.56.24
          vb_memory: 640
          vb_cpus: 1

    redis:
      hosts:
        cache1:
          ansible_host: 192.168.56.31
          vb_memory: 384
          vb_cpus: 1
        cache2:
          ansible_host: 192.168.56.32
          vb_memory: 384
          vb_cpus: 1

    galera:
      hosts:
        db1:
          ansible_host: 192.168.56.41
          vb_memory: 768
          vb_cpus: 1
        db2:
          ansible_host: 192.168.56.42
          vb_memory: 768
          vb_cpus: 1
        db3:
          ansible_host: 192.168.56.43
          vb_memory: 768
          vb_cpus: 1

    storage:
      hosts:
        nfs1:
          ansible_host: 192.168.56.51
          vb_memory: 384
          vb_cpus: 1
