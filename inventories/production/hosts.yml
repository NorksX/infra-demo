---
# Production inventory — single source of truth for hosts, IPs and VM sizing.
# The Vagrantfile parses this file to create the VMs, and Ansible uses it to
# configure them. Network: 192.168.56.0/24 (VirtualBox host-only).
# Sized to ~6.2 GB in total so all 12 VMs fit next to a desktop on a 16 GB host.
#
# Environment-wide settings are in group_vars/all/main.yml.
# Per-host vars used by the Vagrantfile: ansible_host (static IP), vb_memory, vb_cpus.

all:
  children:
    loadbalancers:
      hosts:
        haproxy1:
          ansible_host: 192.168.56.11
          vb_memory: 320
          vb_cpus: 1
        haproxy2:
          ansible_host: 192.168.56.12
          vb_memory: 320
          vb_cpus: 1

    wordpress:
      hosts:
        wp1:
          ansible_host: 192.168.56.21
          vb_memory: 576
          vb_cpus: 1
        wp2:
          ansible_host: 192.168.56.22
          vb_memory: 576
          vb_cpus: 1
        wp3:
          ansible_host: 192.168.56.23
          vb_memory: 576
          vb_cpus: 1
        wp4:
          ansible_host: 192.168.56.24
          vb_memory: 576
          vb_cpus: 1

    redis:
      hosts:
        cache1:
          ansible_host: 192.168.56.31
          vb_memory: 320
          vb_cpus: 1
        cache2:
          ansible_host: 192.168.56.32
          vb_memory: 320
          vb_cpus: 1

    galera:
      hosts:
        db1:
          ansible_host: 192.168.56.41
          vb_memory: 768
          vb_cpus: 1
        db2:
          ansible_host: 192.168.56.42
          vb_memory: 768
          vb_cpus: 1
        db3:
          ansible_host: 192.168.56.43
          vb_memory: 768
          vb_cpus: 1

    storage:
      hosts:
        nfs1:
          ansible_host: 192.168.56.51
          vb_memory: 320
          vb_cpus: 1
