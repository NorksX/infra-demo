---
# Settings for every host in the PRODUCTION environment.
# (Values common to both environments are in inventories/shared/group_vars.)
# Secrets live in the encrypted vault.yml next to this file and are surfaced
# here as plain names (<thing>: "{{ vault_<thing> }}"), so every variable is
# discoverable without decrypting the vault.

env_name: production
domain: shop.local
site_url: "https://{{ domain }}"

# --- Network -----------------------------------------------------------------
private_subnet: 192.168.56.0/24
# Floating IP owned by keepalived; clients and WordPress reach services through it.
lb_vip: 192.168.56.10
keepalived_enabled: true

# --- Application versions ----------------------------------------------------
# Production stays one release behind staging; upgrades are tested in staging
# first and rolled out with playbooks/rolling_update.yml.
wordpress_version: "7.1.4"
woocommerce_version: "11.2.1"

# --- Secrets (from vault.yml) ------------------------------------------------
mysql_root_password: "{{ vault_mysql_root_password }}"
wp_db_password: "{{ vault_wp_db_password }}"
galera_sst_password: "{{ vault_galera_sst_password }}"
redis_password: "{{ vault_redis_password }}"
wp_admin_password: "{{ vault_wp_admin_password }}"
wp_salts: "{{ vault_wp_salts }}"
haproxy_stats_password: "{{ vault_haproxy_stats_password }}"
keepalived_auth_password: "{{ vault_keepalived_auth_password }}"
