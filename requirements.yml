---
# Install with: ansible-galaxy install -r requirements.yml
# Exact versions, as tested (Python packages: requirements.txt).
# (deploy.sh does this automatically before running site.yml.)

roles:
  - name: geerlingguy.mysql
    version: "6.5.0"
  - name: geerlingguy.php
    version: "6.1.0"
  - name: geerlingguy.nginx
    version: "3.3.1"
  - name: geerlingguy.redis
    version: "2.0.0"

collections:
  - name: community.general
    version: "13.5.0"
  # community.mysql is now a thin redirect to ansible.mysql; geerlingguy.mysql
  # still uses the short names, which resolve through it.
  - name: community.mysql
    version: "5.0.2"
  - name: ansible.mysql
    version: "5.2.0"
  - name: ansible.posix
    version: "2.2.2"
  - name: community.crypto
    version: "3.5.1"
