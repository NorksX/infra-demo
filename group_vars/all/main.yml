---
# Same for every host in every environment (playbook group_vars, next to site.yml).
# Environment-specific values live in inventory/<env>/group_vars/all/main.yml.
# Playbook group_vars take precedence over inventory group_vars, so a variable
# belongs either here or in the inventory, never in both.

timezone: Europe/Skopje
store_currency: EUR
deploy_user: deploy

# --- Ports -------------------------------------------------------------------
mysql_port: 3306
redis_port: 6379
haproxy_stats_port: 8404

# --- WordPress ---------------------------------------------------------------
# Document root on every web node; wp-content/uploads inside it is the NFS mount.
wp_docroot: /var/www/wordpress

# --- WordPress database ------------------------------------------------------
wp_db_name: wordpress
wp_db_user: wordpress

# --- Firewall ----------------------------------------------------------------
# SSH stays reachable from anywhere in the lab (Vagrant forwards it over NAT too).
firewall_ssh_from: any
