---
# Full platform deployment, from clean Ubuntu VMs to a working shop.
# Run through deploy.sh, which selects the inventory and vault.

- name: Bootstrap
  ansible.builtin.import_playbook: playbooks/bootstrap.yml

- name: Base OS and hardening
  ansible.builtin.import_playbook: playbooks/common.yml

- name: Database tier
  ansible.builtin.import_playbook: playbooks/database.yml

- name: Storage tier
  ansible.builtin.import_playbook: playbooks/storage.yml

- name: Cache tier
  ansible.builtin.import_playbook: playbooks/cache.yml
