---
# Full platform deployment, from clean Ubuntu VMs to a working shop.
# Run through deploy.sh, which selects the inventory and vault.

- name: Bootstrap
  ansible.builtin.import_playbook: bootstrap.yml

- name: Base OS and hardening
  ansible.builtin.import_playbook: common.yml

- name: Database tier
  ansible.builtin.import_playbook: database.yml

- name: Storage tier
  ansible.builtin.import_playbook: storage.yml

- name: Cache tier
  ansible.builtin.import_playbook: cache.yml

- name: Load balancer tier
  ansible.builtin.import_playbook: loadbalancers.yml

- name: Web tier
  ansible.builtin.import_playbook: webservers.yml

- name: End-to-end verification
  ansible.builtin.import_playbook: verify.yml
