[defaults]
# One inventory per environment (production by default):
#   ansible-playbook -i inventory/staging/hosts.yml site.yml
inventory = inventory/production/hosts.yml
# group_vars/ next to the playbooks holds what is the same in every
# environment; this makes ad-hoc commands (ansible, ansible-inventory) read it too.
playbook_dir = .

# Vault password (gitignored); decrypts inventory/<env>/group_vars/all/vault.yml.
vault_password_file = .vault_pass

# Custom roles live in roles/, Galaxy roles are installed into roles/galaxy/.
roles_path = roles:roles/galaxy
collections_path = ./collections:~/.ansible/collections

remote_user = deploy
private_key_file = files/deploy_key

# A dozen small VMs — run them all in parallel.
forks = 15

host_key_checking = False
retry_files_enabled = False
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer
interpreter_python = auto_silent

# Fact caching speeds up re-runs (idempotency testing).
gathering = smart
fact_caching = jsonfile
fact_caching_connection = fact_cache
fact_caching_timeout = 7200

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no

[privilege_escalation]
become = True
become_method = sudo
