---
# Restart every Galera node one at a time without losing quorum, e.g. after a
# kernel/package update:
#
#   ansible-playbook galera_rolling_restart.yml -i inventory/staging/hosts.yml
- name: Rolling restart of the Galera cluster
  hosts: galera
  tasks:
    - name: Make sure the cluster is healthy before starting
      ansible.builtin.include_role:
        name: galera-cluster
        tasks_from: verify.yml

    - name: Restart nodes one at a time
      ansible.builtin.include_role:
        name: galera-cluster
        tasks_from: rolling_restart.yml

    - name: Verify the cluster afterwards
      ansible.builtin.include_role:
        name: galera-cluster
        tasks_from: verify.yml
